<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bóng đèn</title>
</head>
<body>

<h3>Shisa Shisa nomi</h3>

<img src="no.jpg" alt="Độ Mixi" id="bulb" width="100"><br><br>

<button onclick="toggleLight()">Bật / Tắt chế độ shisa</button>

<script>
    let isOn = false;

    function toggleLight() {
        const bulb = document.getElementById('bulb');

        if (isOn) {
            bulb.src = "no.jpg";
        } else {
            bulb.src = "smoker.jpg";
        }

        isOn = !isOn;
    }
</script>

</body>
</html>
