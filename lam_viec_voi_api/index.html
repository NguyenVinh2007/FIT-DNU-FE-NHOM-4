<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
    const API_URL = "https://69e9954855d62f34797ab40f.mockapi.io/sinhvien";

    function hienThiDanhSachSinhVien(danhSach) {
      const el = document.getElementById("danhSach");
      if (!el) return;

      el.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Tên sinh viên</th>
              <th>Tác vụ</th>
            </tr>
          </thead>
          <tbody>
            ${danhSach.map(sv => `
              <tr>
                <td>${sv.id}</td>
                <td>${sv.ho_ten || sv.name || "Chưa có tên"}</td>
                <td>
                  <button onclick="xemChiTiet(${sv.id})">Xem</button>
                  <button onclick="suaSinhVien(${sv.id})">Sửa</button>
                  <button onclick="xoaSinhVien(${sv.id})">Xóa</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    async function laySinhVien() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("Không thể lấy danh sách sinh viên");

        const data = await response.json();
        console.log("Danh sách sinh viên:", data);
        hienThiDanhSachSinhVien(data);
      } catch (error) {
        console.error("Lỗi:", error);
      }
    }

    async function layMotSinhVien(id) {
      try {
        const response = await fetch(`${API_URL}/${id}`);
        if (!response.ok) throw new Error(`Không thể lấy sinh viên có id = ${id}`);

        const data = await response.json();
        alert(`Thông tin sinh viên:\nID: ${data.id}\nTên: ${data.ho_ten || data.name}`);
      } catch (error) {
        console.error(error);
      }
    }

    async function xoaSinhVien(id) {
      if (!confirm("Bạn có chắc muốn xóa sinh viên này?")) return;
      try {
        const response = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
        if (!response.ok) throw new Error("Không thể xóa sinh viên");
        alert("Đã xóa thành công!");
        laySinhVien(); // refresh danh sách
      } catch (error) {
        console.error(error);
      }
    }

    async function suaSinhVien(id) {
      const tenMoi = prompt("Nhập tên mới cho sinh viên:");
      if (!tenMoi) return;
      try {
        const response = await fetch(`${API_URL}/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ho_ten: tenMoi })
        });
        if (!response.ok) throw new Error("Không thể sửa sinh viên");
        alert("Cập nhật thành công!");
        laySinhVien();
      } catch (error) {
        console.error(error);
      }
    }

    function xemChiTiet(id) {
      layMotSinhVien(id);
    }

    // Gọi API
    laySinhVien();
  </script>
    <div id="danhSach"></div>
    
</body>
</html>
